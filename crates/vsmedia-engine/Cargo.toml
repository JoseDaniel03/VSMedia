[package]
name = "vsmedia-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vsmedia-api = { path = "../vsmedia-api" }
vsmedia-core = { path = "../vsmedia-core" }
vsmedia-pack = { path = "../vsmedia-pack" }
vsmedia-audio = { path = "../vsmedia-audio" }
vsmedia-image = { path = "../vsmedia-image" }
vsmedia-font = { path = "../vsmedia-font" }
vsmedia-protocol = { path = "../vsmedia-protocol" }
vsmedia-formats = { path = "../vsmedia-formats" }
serde_json.workspace = true
base64 = "0.22"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
uuid = { version = "1.11", features = ["v4"] }
