# VSMedia 26.3 - Folia test plugin.
# When web/ is present at build time, the JAR serves the optimized v11 automatically.
# Otherwise it falls back to the old FullCanvas frontend and logs a warning.
# The Rust VSCore process is started by this plugin on Linux x86_64.
# The web always starts with the Folia plugin. JS/audio/pack/rendering runs in browser.
# Keep the HTTP interface on loopback: use an authenticated HTTPS reverse proxy/tunnel for remote users.
# Offer a ZIP only after publishing it on a real, accessible HTTPS URL.
studio-web:
  enabled: true
  port: 3060
studio-core:
  # Linux x86_64: extract the trusted native backend from this JAR and start
  # it on 127.0.0.1:3061. Set false if you already run the Rust bridge.
  autostart: true
resource-pack:
  enabled: false
  required: false
  logical-id: virgoland
  uuid: 'b1dd63eb-5961-53f1-a58d-6c08532cde6e'
  url: 'https://example.invalid/virgoland-resourcepack.zip'
  sha1: '0000000000000000000000000000000000000000'
  size-bytes: 0

# Otros plugins (VSRender, etc.) pueden ceder los packs HTTPS existentes a
# VSMedia sin recompimir ni procesar texturas en Minecraft. El cliente descarga
# capas por UUID/SHA-1 y aplica la prioridad de la pila.
external-packs:
  enabled: true

# Publicación externa: el manifiesto se sube a R2 con tools/vspack_publish.py.
# Nunca guardes claves o secretos de R2 en este archivo ni en el JAR.
# El plugin consulta solamente el JSON público por HTTPS y ofrece las capas.
publication:
  enabled: false
  manifest-url: 'https://packs.example.org/virgoland/current.json'
  check-seconds: 300
