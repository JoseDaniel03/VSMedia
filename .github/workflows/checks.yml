name: Checks
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test --workspace --all-targets
  java-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Test/compile only; no package, release or artifact upload until completion.
      - run: mvn -B -f java/pom.xml test
  studio-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path studio/backend/Cargo.toml --all-targets
  studio-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: node --check studio/assets/live.js
      - run: node --check studio/assets/pack.js
      - run: cargo check --manifest-path studio/Cargo.toml --target wasm32-unknown-unknown
      # Native headless tests exercise the exact timeline history/batch modules.
      - run: cargo test --manifest-path studio/test-support/Cargo.toml --all-targets
