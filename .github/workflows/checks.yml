name: Checks
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test --workspace --all-targets
  studio-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path studio/backend/Cargo.toml --all-targets
      - name: Build native Rust VSCore for Linux x86_64
        run: cargo build --release --manifest-path studio/backend/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: VSMedia-Rust-VSCore-Linux-x86_64
          path: studio/backend/target/release/vsmedia-studio-bridge
          if-no-files-found: error
          retention-days: 14
  vspack-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline optimization and R2 publisher without compiling JARs
        run: python3 -m unittest discover -s tests -p 'test_vspack_publish.py' -v
  studio-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: node --check studio/assets/live.js
      - run: node --check studio/assets/pack.js
      - run: node --check studio/assets/minecraft.js
      - run: node --check studio/assets/radio-sync.js
      - name: Prepare browser OGG/Vorbis codec
        run: |
          bash scripts/build-browser-vorbis.sh
          node --check studio/assets/vs-ogg-vorbis.js
          test -s studio/assets/vs-ogg-vorbis.js
      - name: Verify original FullCanvas Rust editor is preserved
        run: |
          grep -F "data-radio-file-url" studio/src/app.rs
          grep -F 'minecraft.js' studio/index.html
          grep -F 'radio-sync.js' studio/index.html
          test -s studio/assets/minecraft.js
          grep -F 'vs-ogg-vorbis.js' studio/index.html
          test "$(git hash-object studio/src/studio_api.rs)" = "17315d3ce1900b84ab115d1f94f7d3339472824a"
      - run: cargo check --manifest-path studio/Cargo.toml --target wasm32-unknown-unknown
      - run: cargo test --manifest-path studio/test-support/Cargo.toml --all-targets
      - name: Install verified Trunk release
        run: |
          curl --fail --location --retry 3 --output /tmp/trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  /tmp/trunk.tar.gz" | sha256sum --check
          mkdir -p /tmp/vsmedia-trunk
          tar -xzf /tmp/trunk.tar.gz -C /tmp/vsmedia-trunk
          sudo install -m 755 /tmp/vsmedia-trunk/trunk /usr/local/bin/trunk
          trunk --version
      - name: Compile original VSMedia Home/Audio Studio to WebAssembly
        run: cd studio && trunk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: VSMedia-Original-Studio-Web
          path: studio/dist/
          if-no-files-found: error
          retention-days: 14
  java-tests-no-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Provide a tiny web fixture for the existing HTTP unit tests (no JAR)
        run: |
          mkdir -p java/vsmedia-folia-plugin/target/studio-web
          printf '<!doctype html><title>VSMedia test fixture</title>\n' > java/vsmedia-folia-plugin/target/studio-web/index.html
      - name: Compile Java sources and run tests without packaging any JAR
        run: mvn -B -f java/pom.xml test
  java-api:
    # JAR packaging paused by request. Reactivate only when explicitly requested.
    if: ${{ false }}
    needs: [studio-frontend, studio-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('web/index.html') == '' }}
        with:
          name: VSMedia-Original-Studio-Web
          path: java/vsmedia-folia-plugin/target/studio-web
      - uses: actions/download-artifact@v4
        if: ${{ hashFiles('web/index.html') == '' }}
        with:
          name: VSMedia-Rust-VSCore-Linux-x86_64
          path: java/vsmedia-folia-plugin/target/studio-native
      - run: mvn -B -f java/pom.xml verify
      - name: Verify Folia JAR with native VSCore and original WASM Studio
        if: ${{ hashFiles('web/index.html') == '' }}
        run: |
          test -s java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar
          unzip -p java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar plugin.yml | grep -F 'folia-supported: true'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'io/virgoland/vsmedia/plugin/VSMediaPlugin.class'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'io/virgoland/vsmedia/plugin/StudioWebServer.class'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'io/virgoland/vsmedia/plugin/StudioCoreProcess.class'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'studio-web/index.html'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'studio-web/minecraft.js'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'studio-web/vs-ogg-vorbis.js'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -E 'studio-web/.*[.]wasm'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'studio-native/vsmedia-studio-bridge'
      - name: Verify bundled client web when web/ is published
        if: ${{ hashFiles('web/index.html') != '' }}
        run: |
          test -s java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar
          unzip -p java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar plugin.yml | grep -F 'folia-supported: true'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'studio-web-v11/index.html'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'studio-web-v11/assets/js/vs-codecs.js'
          jar tf java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar | grep -F 'studio-web-v11/modules/vspack/vs-model-studio/dist/bundle.js'
      - uses: actions/upload-artifact@v4
        with:
          name: VSMedia-Folia-26.3-Home-Audio-Studio-JAR
          path: java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
