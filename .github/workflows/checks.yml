name: Checks
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test --workspace --all-targets
  studio-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path studio/backend/Cargo.toml --all-targets
      - name: Build native Rust VSCore for Linux x86_64
        run: cargo build --release --manifest-path studio/backend/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: VSMedia-Rust-VSCore-Linux-x86_64
          path: studio/backend/target/release/vsmedia-studio-bridge
          if-no-files-found: error
          retention-days: 14
  vspack-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline optimization and R2 publisher without compiling JARs
        run: python3 -m unittest discover -s tests -p 'test_vspack_publish.py' -v
  studio-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: node --check studio/assets/live.js
      - run: node --check studio/assets/ui-polish.js
      - run: node --check studio/assets/workspace-assets.js
      - run: node tests/test_workspace_assets_ui.mjs
      - run: node tests/test_studio_ui_polish.mjs
      - run: node --check studio/assets/pack.js
      - run: node --check studio/assets/minecraft.js
      - run: node --check studio/assets/vspack-publish.js
      - run: node tests/test_vspack_browser.mjs
      - run: node --check studio/assets/radio-sync.js
      - run: node --check studio/assets/radio-dj.js
      - run: node --check studio/assets/radio-dj-worklet.js
      - name: Prepare browser OGG/Vorbis codec
        run: |
          bash scripts/build-browser-vorbis.sh
          node --check studio/assets/vs-ogg-vorbis.js
          test -s studio/assets/vs-ogg-vorbis.js
      - name: Verify original FullCanvas Rust editor is preserved
        run: |
          grep -F "data-radio-file-url" studio/src/app.rs
          grep -F 'minecraft.js' studio/index.html
          grep -F 'ui-polish.js' studio/index.html
          grep -F 'workspace-assets.js' studio/index.html
          grep -F 'workspace-assets.css' studio/index.html
          grep -F 'vspack-publish.js' studio/index.html
          grep -F 'radio-sync.js' studio/index.html
          grep -F 'radio-dj.js' studio/index.html
          grep -F 'radio-dj-worklet.js' studio/index.html
          test -s studio/assets/minecraft.js
          grep -F 'vs-ogg-vorbis.js' studio/index.html
          test "$(git hash-object studio/src/studio_api.rs)" = "17315d3ce1900b84ab115d1f94f7d3339472824a"
      - run: cargo check --manifest-path studio/Cargo.toml --target wasm32-unknown-unknown
      - run: cargo test --manifest-path studio/test-support/Cargo.toml --all-targets
      - name: Install verified Trunk release
        run: |
          curl --fail --location --retry 3 --output /tmp/trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  /tmp/trunk.tar.gz" | sha256sum --check
          mkdir -p /tmp/vsmedia-trunk
          tar -xzf /tmp/trunk.tar.gz -C /tmp/vsmedia-trunk
          sudo install -m 755 /tmp/vsmedia-trunk/trunk /usr/local/bin/trunk
          trunk --version
      - name: Compile original VSMedia Home/Audio Studio to WebAssembly
        run: cd studio && trunk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: VSMedia-Original-Studio-Web
          path: studio/dist/
          if-no-files-found: error
          retention-days: 14
  java-tests-no-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare and validate original VSMedia AutoMic v14 website
        run: |
          python3 scripts/stage-vsmedia-v14.py 'VSMedia-Studio-2026-AutoMic-v14 (1).tar.gz' web
          test -s web/version.json
          test -s web/modules/vspack/vs-model-studio/dist/bundle.js
          node --check web/assets/js/core.js
          node --check web/assets/js/simple.js
          node --check web/assets/js/mix.js
          node --check web/assets/js/radio.js
      - name: Compile Java and execute HTTP/proxy tests
        run: mvn -B -f java/pom.xml test
  java-api:
    # Explicit, authorized JAR packaging of AutoMic v14 on main and repair branch.
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/vsmedia-studio-v14-bundling-20261120' || github.ref == 'refs/heads/feat/vsmc-live-publish-fonts-sounds-20261120' }}
    needs: [studio-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Stage complete AutoMic v14 web from the uploaded original archive
        run: |
          python3 scripts/stage-vsmedia-v14.py 'VSMedia-Studio-2026-AutoMic-v14 (1).tar.gz' web
          test -s web/index.html
          test -s web/assets/js/core.js
          test -s web/assets/js/vspack.js
          test -s web/modules/vspack/vs-model-studio/dist/bundle.js
          test -s web/modules/vspack/pixel-studio/web/vs-pixel-studio.mjs
          test -s web/assets/js/vsmedia-legacy-cleanup.js
          test -s web/assets/js/vsmedia-minecraft.js
          node --check web/assets/js/vsmedia-legacy-cleanup.js
          node --check web/assets/js/vsmedia-minecraft.js
      - uses: actions/download-artifact@v4
        with:
          name: VSMedia-Rust-VSCore-Linux-x86_64
          path: java/vsmedia-folia-plugin/target/studio-native
      - name: Build and test complete Folia JAR with native VSCore
        run: mvn -B -f java/pom.xml verify
      - name: Assert AutoMic v14 is packaged and legacy FullCanvas is excluded
        run: |
          JAR=java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F 'folia-supported: true'
          jar tf "$JAR" | grep -F 'io/virgoland/vsmedia/plugin/StudioWebServer.class'
          jar tf "$JAR" | grep -F 'studio-web-v14/index.html'
          jar tf "$JAR" | grep -F 'studio-web-v14/assets/js/core.js'
          jar tf "$JAR" | grep -F 'studio-web-v14/assets/js/mix.js'
          jar tf "$JAR" | grep -F 'studio-web-v14/assets/js/radio.js'
          jar tf "$JAR" | grep -F 'studio-web-v14/modules/vspack/vs-model-studio/dist/bundle.js'
          jar tf "$JAR" | grep -F 'studio-web-v14/modules/vspack/pixel-studio/web/vs-pixel-studio.mjs'
          jar tf "$JAR" | grep -F 'studio-web-v14/assets/js/vsmedia-legacy-cleanup.js'
          jar tf "$JAR" | grep -F 'studio-web-v14/assets/js/vsmedia-minecraft.js'
          jar tf "$JAR" | grep -F 'io/virgoland/vsmedia/plugin/StudioPackPublisher.class'
          jar tf "$JAR" | grep -F 'studio-native/vsmedia-studio-bridge'
          unzip -p "$JAR" studio-web-v14/version.json | grep -F '"version": "AutoMic v14"'
          if jar tf "$JAR" | grep -q '^studio-web/index.html$'; then
            echo "Error: FullCanvas legacy sigue incluido" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VSMedia-Folia-26.3-AutoMic-v14-VSCore-JAR
          path: java/vsmedia-folia-plugin/target/vsmedia-folia-plugin-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
