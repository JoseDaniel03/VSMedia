[workspace]
resolver = "2"
members = [
  "crates/vsmedia-api",
  "crates/vsmedia-core",
  "crates/vsmedia-pack",
  "crates/vsmedia-audio",
  "crates/vsmedia-image",
  "crates/vsmedia-font",
  "crates/vsmedia-formats",
  "crates/vsmedia-protocol",
  "crates/vsmedia-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
