[package]
name = "vsmedia-studio"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
 "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAudioElement",
 "HtmlAnchorElement", "HtmlMediaElement", "Storage", "File", "FileList", "Blob", "BlobEvent",
 "Url", "AudioContext", "AudioBuffer", "BaseAudioContext", "AudioDestinationNode",
 "MediaDevices", "Navigator", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints",
 "MediaRecorder", "Event", "EventTarget", "ProgressEvent", "DomTokenList",
 "Request", "RequestInit", "RequestMode", "Response", "Headers", "PointerEvent", "MouseEvent", "KeyboardEvent"
] }

[workspace]
