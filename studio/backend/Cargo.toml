[package]
name = "vsmedia-studio-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
vsmedia-api = { path = "../../crates/vsmedia-api" }
vsmedia-core = { path = "../../crates/vsmedia-core" }
vsmedia-formats = { path = "../../crates/vsmedia-formats" }
vsmedia-audio = { path = "../../crates/vsmedia-audio" }
vsmedia-pack = { path = "../../crates/vsmedia-pack" }
sha2 = "0.10"
percent-encoding = "2.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
